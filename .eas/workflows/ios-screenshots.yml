name: Gimik iPhone App Store screenshots
# Manual only. No publishing, store submission, or production version increment.
on:
  workflow_dispatch: {}
jobs:
  build_ios:
    type: build
    params:
      platform: ios
      profile: screenshots
  screenshots:
    needs: [build_ios]
    type: maestro
    environment: preview
    runs_on: macos-medium
    image: latest
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      flow_path: .maestro/app-store.yml
      device_identifier: Gimik Screenshots
      retries: 0
    hooks:
      after_checkout:
        - name: Prepare screenshot fixture and iPhone
          run: node scripts/prepare-ios-screenshots.cjs
