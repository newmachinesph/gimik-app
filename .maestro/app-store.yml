appId: com.sumnora.gimik
name: App Store screenshots on iPhone 13 Pro Max
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- openLink: gimik://sign-in
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: Welcome back
    timeout: 30000
- tapOn: you@example.com
- inputText: ${MAESTRO_SCREENSHOT_EMAIL}
- tapOn: Choose a password
- inputText: ${MAESTRO_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn:
    text: Sign in
    retryTapIfNoChange: false
- tapOn:
    text: Not Now
    optional: true
- tapOn:
    text: See everything
    optional: true
- extendedWaitUntil:
    notVisible: Welcome back
    timeout: 60000
- openLink: gimik://discover
- extendedWaitUntil:
    visible: Search somedays
    timeout: 30000
- extendedWaitUntil:
    notVisible: Loading the catalog
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: ${MAESTRO_SCREENSHOT_DIR}/01-discover
- openLink: gimik://activity
- extendedWaitUntil:
    visible: Waiting for a date
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${MAESTRO_SCREENSHOT_DIR}/02-your-list
- openLink: gimik://want/mountain-climbing
- extendedWaitUntil:
    visible: Mountain climbing
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${MAESTRO_SCREENSHOT_DIR}/03-activity-details
- openLink: gimik://plan/mountain-climbing
- extendedWaitUntil:
    visible: Who's in
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${MAESTRO_SCREENSHOT_DIR}/04-make-a-plan
- openLink: gimik://messages/${MAESTRO_SCREENSHOT_THREAD}
- extendedWaitUntil:
    visible: Deal. No more saying sometime.
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${MAESTRO_SCREENSHOT_DIR}/05-plan-together
- openLink: gimik://journal/aquarium-touring
- extendedWaitUntil:
    visible: How it went
    timeout: 30000
- extendedWaitUntil:
    visible: Finally made time for this.*
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${MAESTRO_SCREENSHOT_DIR}/06-keep-the-memory
